<nav class="navbar navbar-expand-xl sticky-top px-3 px-md-4 border-bottom custom-navbar">
  <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
    <!-- Sin clases de color de Bootstrap aquí -->
    <span class="material-symbols-rounded brand-icon fs-2">auto_stories</span>
    <span class="brand-text">Librería Online</span>
  </a>

  <!-- Desktop Nav Links -->
  <div class="d-none d-xl-flex flex-grow-1 justify-content-center gap-2 nav-desktop-links">
    @for (item of navItems(); track item.label) {
      <p-button [text]="true" [plain]="true" (onClick)="onNavItemClick(item)">
        <span class="material-symbols-rounded me-2">{{ item.icon }}</span>
        {{ item.label }}
      </p-button>
    }
  </div>

  <div class="d-flex align-items-center gap-2">
    <p-button [rounded]="true" [text]="true" (onClick)="toggleTheme()">
      <span class="material-symbols-rounded">{{ isDark() ? 'light_mode' : 'dark_mode' }}</span>
    </p-button>

    <div class="d-flex align-items-center gap-2 auth-container">
      @if (isLogged()) {
        <p-avatar [label]="initials" shape="circle"></p-avatar>
        <p-button
          icon="pi pi-sign-out"
          [rounded]="true"
          [text]="true"
          styleClass="text-danger"
          (onClick)="logout()"
        ></p-button>
      } @else {
        <p-button routerLink="/login" label="Login" severity="secondary" [outlined]="true" />
        <p-button routerLink="/register" label="Registro" />
      }
    </div>

    <!-- Hamburguesa -->
    <p-button
      class="d-xl-none"
      [rounded]="true"
      [text]="true"
      (onClick)="mobileNavOpen.set(!mobileNavOpen())"
    >
      <span class="material-symbols-rounded">menu</span>
    </p-button>
  </div>
</nav>

<!-- Menú móvil: Condición simple -->
@if (mobileNavOpen()) {
  <div class="mobile-menu-compact border-bottom shadow-sm">
    <div class="d-flex flex-column p-2">
      @for (item of navItems(); track item.label) {
        <p-button
          [text]="true"
          (onClick)="onNavItemClick(item, true)"
          styleClass="w-100 justify-content-start py-2"
        >
          {{ item.label }}
        </p-button>
      }
    </div>
  </div>
}
